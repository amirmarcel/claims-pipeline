[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-pipeline"
version = "0.1.0"
description = "Event-driven synthetic claims processing platform"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.49",
    "psycopg[binary]==3.2.13",
    "fastapi==0.118.3",
    "uvicorn==0.38.0",
    "anthropic==0.75.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[sns,sqs]==1.43.49",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query() are meant to be called in argument
# defaults -- that's the framework's documented dependency-injection idiom,
# not the mutable-default-argument footgun this rule targets elsewhere.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
