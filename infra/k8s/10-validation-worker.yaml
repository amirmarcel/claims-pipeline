# Validation worker (SPEC.md §2 step 3). `replicas: 1` below is only the
# starting point applied before KEDA's ScaledObject (20-keda-scaledobjects.yaml,
# ADR-0004, ADR-0014) exists; once that ScaledObject's HPA is reconciled it
# takes over replica count, and this field is no longer authoritative. Nothing
# about this Deployment (probes, resources, ServiceAccount) needed to change
# to make it autoscaling-ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation-worker
  namespace: claims-pipeline
  labels:
    app: validation-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validation-worker
  template:
    metadata:
      labels:
        app: validation-worker
    spec:
      serviceAccountName: claims-pipeline
      containers:
        - name: validation-worker
          image: claims-pipeline:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "claims_pipeline.workers.validation"]
          envFrom:
            - configMapRef:
                name: claims-pipeline-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          # No HTTP surface on a queue worker, so liveness reads the
          # heartbeat file touch_heartbeat() writes on every poll cycle
          # (src/claims_pipeline/workers/__init__.py) -- confirms the poll
          # loop is actually iterating, not just that the process exists.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'test $(( $(date +%s) - $(stat -c %Y /tmp/claims-pipeline-worker-heartbeat 2>/dev/null || echo 0) )) -lt 60'
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
