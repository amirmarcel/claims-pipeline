# One ServiceAccount for all three workloads. Locally it does nothing beyond
# giving pods an identity; on EKS this is the seam IRSA attaches to (an
# eks.amazonaws.com/role-arn annotation added by infra/eks/ Terraform) so the
# same manifest works in both places without a code or image change.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claims-pipeline
  namespace: claims-pipeline
