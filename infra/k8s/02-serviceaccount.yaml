# One ServiceAccount for all three workloads. A single shared ServiceAccount
# suffices locally because kind has no IAM to scope -- there's nothing to
# least-privilege. On EKS this manifest is NOT reused as-is: infra/eks/iam.tf
# binds three distinct per-workload ServiceAccounts (validation-worker,
# scoring-worker, api), each trust-bound to its own IRSA role, so that every
# workload holds only the queue permissions it actually needs. See
# infra/eks/iam.tf and infra/eks/README.md (which documents splitting this
# manifest into three, one per workload, before applying to EKS).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claims-pipeline
  namespace: claims-pipeline
