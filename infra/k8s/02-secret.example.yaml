# NOT applied as-is and NOT how secrets are created (values below are
# placeholders, not real). This documents the shape of the Secret the
# Deployments expect; create the real one imperatively so no secret value
# ever lands in a committed manifest:
#
#   kubectl create secret generic claims-pipeline-secrets \
#     --namespace claims-pipeline \
#     --from-literal=database-url="postgresql://claims:claims@postgres.claims-pipeline.svc.cluster.local:5432/claims_pipeline" \
#     --from-literal=anthropic-api-key="$ANTHROPIC_API_KEY"
#
# See infra/k8s/README.md for the full local runbook step, including where
# ANTHROPIC_API_KEY comes from (.env, gitignored, never committed).
apiVersion: v1
kind: Secret
metadata:
  name: claims-pipeline-secrets
  namespace: claims-pipeline
type: Opaque
stringData:
  database-url: "postgresql://<user>:<password>@postgres.claims-pipeline.svc.cluster.local:5432/claims_pipeline"
  anthropic-api-key: "<your ANTHROPIC_API_KEY>"
