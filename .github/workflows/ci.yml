name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest
        # Tier 1 + Tier 2 tests (docs/EVAL_PLAN.md) land here starting Session 2
        # and block merge unconditionally once present.

  # Tier 3 faithfulness-eval job is added in Session 5, once the explanation
  # layer and golden faithfulness set exist. It reports the score and blocks
  # only on regression below the committed baseline (docs/EVAL_PLAN.md).